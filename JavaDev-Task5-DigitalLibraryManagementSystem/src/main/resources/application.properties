spring.application.name=digital-library-system

# Optional local file for secrets (MAIL_PROVIDER, BREVO_API_KEY, ...). Not committed. See local.properties.example.
spring.config.import=optional:file:./local.properties,optional:file:./JavaDev-Task5-DigitalLibraryManagementSystem/local.properties

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.tomcat.threads.max=20

# ---------- MySQL ----------
# Locally this uses your own MySQL. When hosted, DB_URL, DB_USERNAME and DB_PASSWORD are set as environment variables.
# The database "digital_library" is created automatically if it does not exist (local MySQL only).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digital_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:LUCID1212}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000

# ---------- JPA / Hibernate ----------
# "update" creates the tables on first run and adds new columns later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Library rules (change freely) ----------
library.loan-days=14
library.max-active-loans=5
library.fine-per-day=5
# \u20B9 = Indian rupee sign (the spec says 5 per day). Use \u20A6 for Naira.
library.currency-symbol=\u20B9

# ---------- First-run seed data ----------
library.admin-name=Library Admin
library.admin-email=${ADMIN_EMAIL:admin@library.com}
library.admin-password=${ADMIN_PASSWORD:Admin@123}
library.seed-sample-books=true

# ---------- Email codes (sign-up verification and password reset) ----------
# provider=log prints the email (with the code) in the console, for local use.
# provider=brevo really sends it through Brevo's HTTPS API (set BREVO_API_KEY and MAIL_FROM).
library.mail.provider=${MAIL_PROVIDER:log}
library.mail.brevo-api-key=${BREVO_API_KEY:}
library.mail.from-email=${MAIL_FROM:no-reply@example.com}
library.mail.from-name=${MAIL_FROM_NAME:The Reading Room}
library.verification.code-minutes=10
library.verification.resend-seconds=60
library.verification.max-attempts=5
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s
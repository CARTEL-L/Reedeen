<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container workspace-page">
    <p class="eyebrow">LIBRARY OVERVIEW</p>
    <h1>Admin dashboard</h1>
    <p class="subtitle">A quick view of what is happening in the library.</p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="stats">
        <a class="stat" th:href="@{/admin/books}"><div class="num" th:text="${totalTitles}">0</div><div class="lbl">Book titles</div></a>
        <a class="stat" th:href="@{/admin/members}"><div class="num" th:text="${totalMembers}">0</div><div class="lbl">Members</div></a>
        <a class="stat" th:href="@{/admin/loans}"><div class="num" th:text="${issuedNow}">0</div><div class="lbl">Books issued now</div></a>
        <a class="stat danger" th:href="@{/admin/loans}"><div class="num" th:text="${overdueNow}">0</div><div class="lbl">Overdue books</div></a>
        <a class="stat danger" th:href="@{/admin/fines}"><div class="num" th:text="${currency} + ${unpaidFines}">0</div><div class="lbl">Unpaid fines</div></a>
        <a class="stat" th:href="@{/admin/fines}"><div class="num" th:text="${currency} + ${collectedFines}">0</div><div class="lbl">Fines collected</div></a>
        <a class="stat" th:href="@{/admin/messages}"><div class="num" th:text="${openMessages}">0</div><div class="lbl">Open messages</div></a>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container auth-layout">
    <section class="auth-aside">
        <p class="eyebrow">Locked out?</p>
        <h1>We will get you back in.</h1>
        <p>Enter the email address you registered with and we will send a 6-digit code to reset your password.</p>
        <span class="auth-decoration">NEW<br>CHAPTER.</span>
    </section>
    <section class="card auth-card">
        <p class="eyebrow">Password help</p>
        <h2>Forgot your password?</h2>
        <p class="subtitle">The code works once and only for a few minutes.</p>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <form th:action="@{/forgot-password}" th:object="${form}" method="post">
            <label for="email">Email address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" autofocus>
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            <div class="form-actions"><button type="submit" class="btn">Send me a code <span>↗</span></button></div>
        </form>
        <p class="auth-foot">Remembered it? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
</body>
</html>

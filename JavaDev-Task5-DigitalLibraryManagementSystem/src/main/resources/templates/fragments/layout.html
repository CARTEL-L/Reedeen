<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10243a">
    <title th:text="${title} + ' | The Reading Room'">The Reading Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="site-header" th:fragment="navbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">R</span>
        <span class="brand-copy"><strong>THE READING ROOM</strong><small>Digital Library</small></span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
        <th:block sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin}">Overview</a>
            <a th:href="@{/admin/books}">Collection</a>
            <a th:href="@{/admin/loans}">Loans</a>
            <a th:href="@{/admin/fines}">Fines</a>
            <a th:href="@{/admin/members}">Members</a>
            <a th:href="@{/admin/messages}">Messages</a>
        </th:block>
        <th:block sec:authorize="hasRole('USER')">
            <a th:href="@{/books}">Explore books</a>
            <a th:href="@{/my/loans}">My loans</a>
            <a th:href="@{/my/reservations}">Reservations</a>
            <a th:href="@{/contact}">Help desk</a>
        </th:block>
        <th:block sec:authorize="!isAuthenticated()">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/login}">Sign in</a>
            <a class="nav-join" th:href="@{/register}">Join the library <span>↗</span></a>
        </th:block>
    </nav>
    <form sec:authorize="isAuthenticated()" class="inline logout-form" th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Sign out <span>↗</span></button>
    </form>
</header>

<div class="flash-stack" th:fragment="flash">
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
</div>

</body>
</html>

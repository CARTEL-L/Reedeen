<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container auth-layout">
    <section class="auth-aside">
        <p class="eyebrow">Almost done</p>
        <h1>Choose a fresh password.</h1>
        <p>Enter the code we emailed you and pick a new password. Use at least 8 characters.</p>
        <span class="auth-decoration">FRESH<br>START.</span>
    </section>
    <section class="card auth-card">
        <p class="eyebrow">Password reset</p>
        <h2>Set a new password</h2>
        <p class="subtitle">No code yet? <a th:href="@{/forgot-password}">Ask for a new one</a>.</p>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <form th:action="@{/reset-password}" th:object="${form}" method="post">
            <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
            </div>
            <label for="email">Email address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="you@example.com">
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            <label for="code">6-digit code</label>
            <input type="text" id="code" th:field="*{code}" class="code-input" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" placeholder="000000" autofocus>
            <div class="field-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
            <label for="password">New password</label>
            <input type="password" id="password" th:field="*{password}" placeholder="At least 8 characters">
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Enter it again">
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            <div class="form-actions"><button type="submit" class="btn">Change password <span>↗</span></button></div>
        </form>
        <p class="auth-foot"><a th:href="@{/login}">Back to sign in</a></p>
    </section>
</main>
</body>
</html>
